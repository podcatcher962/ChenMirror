<style>
:root{
  --bg:#0d0d1a;--card:#13132b;--bdr:#2a2a4a;--accent:#4a69bd;--gold:#ffd700;
  --text:#c8d6e5;--dim:#7f8fa6;--inp:#0c0c22;--mutedBdr:#2a2a4a;

}
html[data-theme="light"]{
  --bg:#f2e6cd;--card:#faf0dc;--bdr:#b8914f;--accent:#7a5c1e;--gold:#8a6a35;
  --text:#3e2f1d;--dim:#7d6a4d;--inp:#f7ecd6;--mutedBdr:#d8c39a;
  --shadow:0 0 24px rgba(138,106,53,0.14);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--text);font-family:'SimSun','Songti SC','Microsoft YaHei',serif;
  min-height:100vh;padding:0 0 60px;transition:background 0.3s,color 0.3s;
}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.topbar{display:flex;justify-content:flex-end;gap:12px;padding:14px 16px;flex-wrap:wrap;align-items:center}
.topbar a{color:var(--dim);font-size:13px;cursor:pointer;letter-spacing:1px;border-bottom:1px solid transparent;user-select:none}
.topbar a:hover{color:var(--gold)}
.topbar a.active{color:var(--gold);font-weight:bold}
/* 开屏 */
#splash{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:splashFade 6s ease forwards}
@keyframes splashFade{0%{opacity:1}70%{opacity:1}100%{opacity:0;visibility:hidden}}
#splash .big{font-size:56px;letter-spacing:24px;color:var(--gold);font-family:'FangSong','STFangsong',serif;text-indent:24px}
#splash .sub{font-size:14px;letter-spacing:10px;color:var(--dim);margin-top:14px;text-indent:10px}
#splash .quote{font-size:15px;color:var(--accent);margin-top:30px;letter-spacing:3px;font-family:'KaiTi','STKaiti',serif}
#splash .sig{font-size:11px;color:var(--dim);margin-top:8px;letter-spacing:2px}
/* Header */
.hdr{text-align:center;margin:18px 0 22px}
.hdr h1{font-size:40px;color:var(--gold);letter-spacing:18px;text-indent:18px;font-family:'FangSong','STFangsong',serif}
.hdr .sub{font-size:15px;color:var(--accent);letter-spacing:8px;margin-top:10px;text-indent:8px;font-family:'KaiTi','STKaiti',serif}
.hdr .slogan{font-size:12px;color:var(--dim);letter-spacing:2px;margin-top:12px}
/* 印章 */
.seal{display:inline-block;width:44px;height:44px;border:2px solid #b03a2e;color:#b03a2e;font-size:11px;line-height:44px;text-align:center;border-radius:6px;font-family:'KaiTi',serif;letter-spacing:1px;transform:rotate(-4deg);margin-top:10px}
/* 统计 */
.stats{display:flex;justify-content:center;gap:16px;margin:18px 0;flex-wrap:wrap}
.stat{text-align:center;border:1px solid var(--bdr);padding:10px 20px;min-width:96px;background:var(--card)}
.stat .num{font-size:22px;color:var(--gold);font-weight:bold}
.stat .lbl{font-size:10px;color:var(--dim);letter-spacing:2px;margin-top:2px}
/* 36 门列表 */
.sec-h{display:flex;align-items:center;gap:12px;margin:26px 0 14px}
.sec-h .bar{flex:1;height:1px;background:var(--bdr)}
.sec-h h2{font-size:16px;color:var(--gold);letter-spacing:4px;white-space:nowrap}
.gates{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gate{
  background:var(--card);border:1px solid var(--bdr);padding:12px 14px;cursor:pointer;
  display:flex;align-items:center;gap:10px;transition:transform 0.15s,box-shadow 0.2s;box-shadow:var(--shadow);
}
.gate:hover{transform:translateY(-2px)}
.gate .no{font-size:12px;color:var(--dim);font-family:monospace;min-width:26px}
.gate .gn{font-size:16px;color:var(--gold);letter-spacing:2px;font-family:'KaiTi',serif}
.gate .gt{font-size:11px;color:var(--dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gate .ok{color:#3b6d11;font-size:13px}
.gate.done{border-color:#639922;opacity:0.85}
/* 镜面页 */
.card{background:var(--card);border:2px solid var(--bdr);padding:26px 28px;margin-top:14px;box-shadow:var(--shadow)}
.card .g{font-size:13px;color:var(--accent);letter-spacing:6px;font-family:'KaiTi',serif}
.card h3{font-size:22px;color:var(--text);margin:10px 0 14px;letter-spacing:2px;font-family:'KaiTi',serif}
.card .scene{font-size:15px;line-height:2;color:var(--text);border-left:3px solid var(--bdr);padding-left:14px;margin-bottom:16px}
.story{background:var(--inp);border:1px solid var(--mutedBdr);padding:14px 16px;margin-bottom:14px}
.story .s1{font-size:14px;line-height:2.1;color:var(--text);font-family:'KaiTi','STKaiti',serif}
.story .s2{font-size:13px;line-height:2;color:var(--dim);margin-top:8px}
.story .src{font-size:10px;color:var(--dim);margin-top:8px;letter-spacing:1px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  border:1px solid var(--bdr);padding:13px 16px;cursor:pointer;font-size:14px;color:var(--text);
  background:var(--inp);text-align:left;transition:all 0.15s;font-family:inherit;letter-spacing:1px;
}
.opt:hover{border-color:var(--gold);color:var(--gold)}
.opt.sel{border-color:var(--gold);background:var(--card)}
.verdict{margin-top:14px;border:2px solid var(--gold);padding:18px 20px;background:var(--card)}
.verdict .v-t{font-size:14px;color:var(--gold);letter-spacing:3px;margin-bottom:10px}
.verdict .v-j{font-size:14px;line-height:2.1;color:var(--text)}
.verdict .v-p{font-size:12px;color:var(--accent);margin-top:10px;letter-spacing:2px}
.btn{
  display:inline-block;margin-top:16px;padding:11px 26px;border:1px solid var(--gold);color:var(--gold);
  background:var(--inp);cursor:pointer;font-size:14px;letter-spacing:2px;font-family:inherit;transition:all 0.15s;text-decoration:none;
}
.btn:hover{background:var(--gold);color:var(--bg)}
.btn.primary{background:linear-gradient(180deg,#c9a25a,#a37c34);color:#33230c;border:none;text-shadow:none}
html[data-theme="dark"] .btn.primary{background:linear-gradient(180deg,#4a69bd,#2c4a8f);color:#ffd700}
/* 结果页 */
.result .persona{display:flex;align-items:center;gap:18px;margin:14px 0;flex-wrap:wrap}
.result .avatar{width:96px;height:96px;border-radius:50%;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--inp)}
.result .pt2{flex:1;min-width:200px}
.result .pt2 .n{font-size:26px;color:var(--gold);letter-spacing:4px;font-family:'KaiTi',serif}
.result .pt2 .d{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.8}
.radar{max-width:340px;margin:10px auto}
.radar svg{width:100%;height:auto}
.bars{margin:12px 0}
.bar-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.bar-row .bn{width:30px;font-size:13px;color:var(--gold);font-family:'KaiTi',serif}
.bar-row .bt{flex:1;height:12px;background:var(--inp);border:1px solid var(--mutedBdr)}
.bar-row .bf{height:100%;background:linear-gradient(90deg,#c9a25a,#a37c34)}
.bar-row .bv{width:40px;font-size:12px;color:var(--dim);text-align:right}
/* 日课 */
.dayword{background:var(--card);border:2px solid var(--bdr);padding:22px 26px;text-align:center;box-shadow:var(--shadow)}
.dayword .w{font-size:19px;color:var(--text);font-family:'KaiTi',serif;letter-spacing:2px;line-height:2}
.dayword .ws{font-size:11px;color:var(--dim);margin-top:10px;letter-spacing:2px}
.days{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.day-chip{width:44px;height:44px;border:1px solid var(--mutedBdr);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim)}
.day-chip.on{border-color:#639922;color:#639922;background:rgba(99,153,34,0.12)}
/* Footer */
.foot{margin-top:44px;text-align:center;color:var(--dim);font-size:11px;line-height:2;letter-spacing:1px}
.foot a{color:var(--accent);text-decoration:none}
.tagline{font-size:10px;color:var(--dim);margin-top:6px}
@media(max-width:640px){
  .hdr h1{font-size:32px;letter-spacing:10px;text-indent:10px}
  .gates{grid-template-columns:1fr}
  .card{padding:18px 16px}
  #splash .big{font-size:40px;letter-spacing:16px;text-indent:16px}
}
</style>

<script>
/* 澄怀 · 世说镜鉴录 — 36 门处境镜鉴数据（1-12）*/
/* p: 傲(嵇康) 郁(阮籍) 雅(谢安) 逸(王羲之) 和(王导) 归(陶潜) */
const MIRRORS_PART1 = [
{
id:1, gate:"德行", title:"利益与情义，选哪边？",
scene:"多年的朋友求你帮他做个假，说事成后给你分成。你帮，对不起自己；不帮，这段关系可能就此完了。",
st:"管宁、华歆共园中锄菜，见地有片金，管挥锄与瓦石不异，华捉而掷去之。又尝同席读书，有乘轩冕过门者，宁读如故，歆废书出看。宁割席分坐曰：「子非吾友也。」",
sz:"管宁和华歆一起锄地，挖到金子，管宁当它是石头继续锄，华歆捡起来又扔了。同席读书时，有达官贵人的车马经过，管宁照旧读书，华歆放下书跑出去看。管宁把席子割开，说：你不是我的朋友。",
opts:[
 {t:"帮——情义比规矩重要", p:"和", j:"你选择了关系的温度。王导式的圆融告诉你：世道从来不是非黑即白。但判词要点醒你：华歆最初也把金子“掷去之”，他不是天生小人，只是“看得起热闹”——你帮一次假，下次他还会不会拿别的来换你？情义的账，怕的是算不清。割席不是绝交，是给关系立界碑。"},
 {t:"不帮——底线不能动", p:"傲", j:"你选了管宁。这不是清高，是知道自己值多少钱：金子挖出来时你不动心，不是因为不爱钱，是因为怕爱钱会爱到没样子。管宁割席那一刻没有愤怒，只有安静——真正的底线都是安静划下的。代价你也清楚：朋友可能记恨，但记恨你的人，本来就不是同路人。"},
 {t:"敷衍——帮一半留一半", p:"郁", j:"你不想撕破脸，又不想脏了手。阮籍式的活法：口不臧否人物，心里雪亮。你递了张模糊的牌：'我尽量。'——这牌不会真帮他做成假，但给了彼此台阶。只是要小心：和稀泥久了，连你自己都会分不清哪句是真话。郁，是清醒者的病，别让它变成你的习惯。"}
]},
{
id:2, gate:"言语", title:"一句话，说还是不说？",
scene:"部门大会上，领导刚拍板的方案有硬伤。全场安静。你开口，可能得罪人；不开口，心里过不去。",
st:"桓公北征，经金城，见前为琅邪时种柳，皆已十围，慨然曰：「木犹如此，人何以堪！」攀枝执条，泫然流泪。",
sz:"桓温北伐经过金城，看见自己当年做琅邪太守时种的柳树，都已长到十围粗，感慨地说：树都这样了，人怎么经受得住岁月！拉着枝条，潸然泪下。",
opts:[
 {t:"当众指出，对事不对人", p:"雅", j:"你说出口，是因为你认为真话比场面重要。谢安的雅量不是忍气吞声，是看清全局后依然开口——他泛海遇风浪也面色如常，因为他先在心里过完了最坏的结果。会说话的真话，是把'你错了'说成'方案有个风险点'。风浪挡不住你，但风浪里的措辞，决定你是谢安还是愣头青。"},
 {t:"会后私下提醒", p:"和", j:"你选了给领导留面子的路。王导一辈子周旋于皇权与门阀之间，最懂'面子是权力的空气'。私下说是聪明，但若你次次都私下说、从未当众说过，领导心里自有一本账：这人可用，不可托。圆融的极限，是别人猜不透你的立场——你自己要留一盏灯，让该知道的人知道你其实有立场。"},
 {t:"算了，不值得", p:"归", j:"你算了，不是懦弱，是算过账了：这方案砸了自有砸了的解法，而你不想为一个可能被当成挑衅的意见耗掉一天的好心情。陶潜不为五斗米折腰，是去种地，不是去斗嘴。但请确认一件事：你是真的放下了，还是把不满咽成了内伤？归隐的人从不带怨气上路，若带着，那不是归，是逃。"}
]},
{
id:3, gate:"政事", title:"烂摊子，接不接？",
scene:"公司最难的季度到了，明摆着是个背锅位。领导问谁愿意上。你资历够、人缘好，但接了大概率挨骂。",
st:"陶公性检厉，勤于事。作荆州时，敕船官悉录锯木屑，不限多少，咸不解此意。后正会，值积雪始晴，听事前除雪后犹湿，于是悉用木屑覆之，都无所妨。官用竹皆令录厚头，积之如山。后桓宣武伐蜀，装船，悉以作钉。",
sz:"陶侃做荆州刺史时，命令造船的官员把锯木屑全都收起来，大家都不懂为什么。后来正月初一集会，积雪初晴，厅前地面湿滑，就用木屑铺地。官府用的竹子也让他把竹根都攒下，堆成山。后来桓温伐蜀，造船缺钉，正好用竹根做钉子。",
opts:[
 {t:"接——锅背得起，事才做得成", p:"雅", j:"你看到的不只是锅，是锅底下的机会。陶侃连木屑竹头都留着，因为他信'今天用不上的，明天就是钉子'。接下烂摊子的人有两种：一种是没办法，一种是有办法。你选了后者，说明你已经开始在心里清点木屑了。谢安在淝水之战时下棋如常，因为他早把棋子算过一遍——你也是。"},
 {t:"不接——凭什么是我的锅", p:"傲", j:"你不接，因为你清楚这不是你的职责，更不是你造成的。嵇康拒官时也这样想：我不欠这个世界一场表演。但陶侃的提醒值得一听：他收木屑时没人懂，人人都当他是怪人——可荆州因此从未有踩滑摔倒的宾客。有些'闲事'，接了才显出你是谁。拒接是你的权利，拒接之后主动做点什么，是你的风度。"},
 {t:"半推半就——接了但先声明", p:"郁", j:"你接了，但先把丑话说在前头：'我尽力，但别怪我。'这是阮籍式的手势——人在曹营，心却保留着拒绝。你保护自己没错，可你也要明白：声明太多，会变成免责声明；领导记住的往往不是你的声明，是你的表情。郁结之气会从语气里漏出来。要么爽快接，要么干净拒，卡在中间的犹豫，最耗人。"}
]},
{
id:4, gate:"文学", title:"才华被碾压的时刻",
scene:"朋友圈里老同学又发了获奖证书。你当年比他强。深夜刷到，心里说不出的滋味。",
st:"郑玄家奴婢皆读书。尝使一婢，不称旨，将挞之，方自陈说，玄怒，使人曳著泥中。须臾，复有一婢来，问曰：「胡为乎泥中？」答曰：「薄言往愬，逢彼之怒。」",
sz:"郑玄家的婢女都读书。一次有个婢女做事不合意，郑玄要打她，她为自己辩解，郑玄更生气，让人把她拖到泥里。一会儿另一个婢女走来，问：为什么在泥里？她答：我去诉说委屈，正撞上他发火。两个婢女对答，用的都是《诗经》里的句子。",
opts:[
 {t:"化嫉妒为学习，暗暗使劲", p:"逸", j:"你能把酸味酿成动力，这是王羲之的路——他早年自认不如庾翼，却一笔一画把自己练成'书圣'。文学门里最深的道理：郑玄家的婢女都能用《诗经》对话，不是她们天才，是环境把她们泡透了。你不必嫉妒那个获奖的人，你要嫉妒的是他背后那套环境。去造你自己的环境，十年后，他的证书会变成你的背景板。"},
 {t:"承认不如，但我不攀比", p:"归", j:"你淡淡地划掉那条朋友圈，心里想：他走他的阳关道。陶潜写'不戚戚于贫贱，不汲汲于富贵'，不是因为他没才华，是因为他算清了账：才华一旦用来比较，就变成了债务。你认输认得很体面，这就够了。只是要留个心眼：真放下的不会刻意划掉，若你反复划掉同一个人，那叫惦记，不叫放下。"},
 {t:"凭什么是他？我替他可惜", p:"郁", j:"你盯着他的证书，心里翻出他当年的黑历史——这味道，阮籍懂：他看透世道，却堵在心里，只能借酒浇愁。郁的人不是没才华，是才华喂给了比较。你替他可惜，其实是在替自己不值。阮籍的出口是'穷途之哭'，哭完接着走；你的出口是什么？找到它，别让酸味在胃里发酵太久。"}
]},
{
id:5, gate:"方正", title:"老板让你送礼",
scene:"领导暗示你给客户送点'心意'，说大家都这样。你干不出来，又怕显得不合群。",
st:"王恭从会稽还，王大看之。见其坐六尺簟，因语恭：「卿东来，故应有此物，可以一领及我。」恭无言。大去后，即举所坐者送之。既无余席，便坐荐上。后大闻之，甚惊，曰：「吾本谓卿多，故求耳。」对曰：「丈人不悉恭，恭作人无长物。」",
sz:"王恭从会稽回来，王大来看他，见他坐着六尺竹席，就说：你从东边来，应该多带了这个，送我一领吧。王恭没说话。王大走后，王恭就把自己坐的席子送了过去，自己坐在草垫上。王大后来听说，很惊讶：我以为你多着呢！王恭说：您不了解我，我做人，从来不多余置办东西。",
opts:[
 {t:"送——人在江湖身不由己", p:"和", j:"你把它当成人情世故的学费。王导周旋于宫廷与世家之间，深知有些'礼'不是贿赂，是信号。但王恭提醒你另一面：他送席子时一声不吭——送得干净，才不辱没送的人。你若送，就别在背后骂客户骂自己；若连自己都过不去，这笔学费迟早加倍还回来。"},
 {t:"不送——脏手的事我不做", p:"傲", j:"你选了王恭：我做人，无长物——没有多余的东西，也没有多余的事。他坐草垫子也不后悔，因为席子给了人，他还有自己的脊梁。拒绝送礼在职场里是'不合群'，但你要分清：不合群和不可靠是两回事。不送礼的人如果业务够硬，老板反而敬你三分。怕的是你既不肯送礼，又没本事硬气——那就成了真的孤家寡人。"},
 {t:"拖——先应着，到时再说", p:"郁", j:"你嗯嗯啊啊地应了，心里却盘算着怎么糊弄过去。这是阮籍的生存术：礼法岂为我辈所设，但也不与你正面冲突。拖延不是办法，是止痛药。对方迟早会再问，你迟早要面对那个答案。阮籍能拖一辈子，是因为他真打算'避世'；你若还在这江湖里，拖出来的每一周，都是在给'不干'攒利息。"}
]},
{
id:6, gate:"雅量", title:"突发状况，你慌了",
scene:"汇报到一半，大屏黑了，数据全没了。全场几十双眼睛看着你。三秒钟的安静，像三百年。",
st:"谢太傅盘桓东山时，与孙兴公诸人泛海戏。风起浪涌，孙、王诸人色并遽，便唱使还。太傅神情方王，吟啸不言。舟人以公貌闲意说，犹去不止。既风转急，浪猛，诸人皆喧动不坐。公徐云：「如此，将无归！」众人即承响而回。于是审其量，足以镇安朝野。",
sz:"谢安在东山时，和孙绰等人乘船出海。风浪骤起，孙绰王羲之等人都变了脸色，喊着要回去。谢安却兴致正高，吟啸不语。船夫看他神色从容，便继续划。后来风更急浪更猛，众人喧闹得坐不住了。谢安这才缓缓说：既然如此，那就回去吧。大家立刻应声而回。由此可知，他的器量足以安定天下。",
opts:[
 {t:"稳住，先开个玩笑再救场", p:"雅", j:"你身上有谢安的影子：风浪越急，你越慢。他泛海时吟啸不言，不是不怕，是把怕压进了韵脚里。你先开玩笑，是在给全场人发'镇定剂'——人在慌乱时需要的不是真相，是节奏。记住这个时刻的你自己：你刚才在全世界面前，展示了什么叫'泰山崩于前而色不变'。这份气度，是装不出来的，也是丢不掉的。"},
 {t:"当场承认失误，请求两分钟", p:"和", j:"你没有硬撑，直接认了——这反而高明。王导掌权时也常说'愦愦'（糊涂），他信：承认局部糊涂，才能稳住全局。慌的时候，最贵的就是'诚实'二字。你没让场面继续烂下去，给了一个具体的解法：两分钟。这是高手动作：给恐慌一个边界，恐慌就会退潮。台下人对你的评价，不会因为你刚才黑屏而下降，会因为你刚才那句话而上升。"},
 {t:"大脑空白，硬着头皮讲", p:"郁", j:"你嘴上在讲，脑子却在放烟花。这种时刻，阮籍也扛不住——他能在朝堂上一醉六十日，是因为清醒太疼。硬撑不是不行，但你要知道：全场人都看出来了，只是没说。与其让气氛替你尴尬，不如学谢安那句'如此，将无归'——把意外变成全场都懂的梗，你反而赢了。慌不是罪，慌了还装不慌，才是。"}
]},
{
id:7, gate:"识鉴", title:"要不要推荐亲戚进公司？",
scene:"你表弟能力平平，但踏实。你所在部门正好缺人，HR 让你内推。推，怕将来打脸；不推，亲戚面子挂不住。",
st:"谢公尝与诸人论人物，谓：「有识鉴者，不妄许人。」又，谢安举谢玄，人问其故，答曰：「吾尝见其使才，虽履屐之间，亦得其任。」",
sz:"谢安曾和人谈论人物，说：有识鉴之明的人，不轻易夸人。他又曾举荐侄子谢玄，别人问他为什么，他说：我见过他办事，即使在鞋屐这样的小事上，也能安排得妥帖得当。后来谢玄果然在淝水之战大破前秦。",
opts:[
 {t:"推——给他一个机会", p:"雅", j:"你推他，不是因为亲戚，是因为你观察过他做事——就像谢安举谢玄，看的是'履屐之间亦得其任'。这是识鉴的最高境界：不凭关系下注，凭细节下注。但谢安敢举谢玄，是因为他赌得起也输得起：万一谢玄不行，他认。你也该想清楚这一层：你愿不愿意为表弟的失误买单？愿意，就推；不愿意，就别用'给他机会'骗自己。"},
 {t:"不推——不想拿信誉冒险", p:"傲", j:"你不推，是把'我的判断'看得比'亲戚关系'重。嵇康跟山涛绝交，也是这个逻辑：我的原则不因你是谁而打折。但你得把话说漂亮——拒绝亲戚的秘诀是给台阶：'我内推的票，只能投给最有把握的人，不是给你，是给公司。' 对方听得懂就懂，听不懂的亲戚，本来也不适合做同事。识鉴，首先识自己：你到底是怕他不行，还是怕他行了你脸上挂不住？"},
 {t:"推但丑话说前头——成不成看他自己", p:"和", j:"你推了，但先签了免责声明：'我内推，但不打包票。'这是王导式的稳妥：给关系一个交代，给风险留一条退路。圆融没什么不好，只是提醒你：谢安推荐谢玄时，是真心觉得他行——'丑话说前头'的说辞，说多了，会变成你的名片。人情做一半，不如做到底；做到底，要么是知人之明，要么是识人不明的学费，都算数。"}
]},
{
id:8, gate:"赏誉", title:"你希望别人怎么评价你？",
scene:"公司要评年度人物，写推荐语。你心里其实很在意：大家会怎么写我？",
st:"王戎云：「太尉神姿高彻，如瑶林琼树，自然是风尘外物。」",
sz:"王戎评论王衍说：太尉神姿高远明彻，像瑶林琼树一样，自然是超脱尘世之外的人物。",
opts:[
 {t:"能力强——'这事没他不行'", p:"雅", j:"你希望被说'靠谱'，这没错，但谢安想提醒你：他名满天下，靠的不是'没他不行'，是他在的时候大家都不慌。能力是地基，气度才是楼。'没他不行'的人往往最累——因为你把'不可或缺'做成了标签，就要一直背着它。你想要的评价，也许该是'有他在，就稳了'。"},
 {t:"人品好——'跟他共事舒服'", p:"和", j:"你要的是'舒服'，这其实是王导的遗产：他执政多年，靠的就是人人都觉得跟他打交道不吃亏。但王戎那句'瑶林琼树'点的是另一层：真正让人记住的赞美，往往不是因为你好相处，而是因为你有样子。别人舒服是下限，自己有样子，才是上限。你想要的评价里，有没有一条关于'你自己'的？"},
 {t:"有才华——'他做的事有灵气'", p:"逸", j:"你要'灵气'，这是王羲之的赛道：他东床坦腹，不装样子，最后成了书圣。才华型的人最怕的不是没人夸，是夸的方式不对——'努力'两个字对你们是侮辱。王戎夸王衍'风尘外物'，夸的是不可复制的气质，不是可复制的努力。你想要的评价，其实是'他是特别的'——那就去做那件只有你能做的事。"}
]},
{
id:9, gate:"品藻", title:"你和同行，谁更强？",
scene:"同行朋友最近风头很盛，人人都拿你俩比较。你嘴上说不在乎，心里其实常翻这个账。",
st:"桓公少与殷侯齐名，常有竞心。桓问殷：「卿何如我？」殷云：「我与我周旋久，宁作我。」",
sz:"桓温年轻时和殷浩齐名，心里常存竞争之心。桓温问殷浩：你和我比，谁更强？殷浩说：我和我自己周旋最久，宁可做我自己。",
opts:[
 {t:"承认他强，但我不慌", p:"雅", j:"你能坦然说'他确实有两下子'，是因为你心里有自己的秤。谢安和桓温也是对手，谢安从来不慌，因为他知道对手的价值：没有桓温，天下人不会知道谢安的稳。承认对手强，不是认输，是把比较变成参照物——你不必赢过所有人，你只需要赢过昨天的自己。"},
 {t:"嘴上谦虚，心里较劲", p:"郁", j:"你笑着说'各有各的路'，回家却翻来覆去。阮籍和所有人都是这种关系：嘴上不臧否，心里全明白。较劲本身不坏——桓温就是靠这股劲走到权倾天下的。坏的是较劲较到失眠：那时你比的已经不是才华，是焦虑。殷浩那句'宁作我'，不是躺平，是提醒：你对自己了解得越深，别人越伤不到你。"},
 {t:"我要证明我比他强", p:"傲", j:"你把'赢他'写进了日程。嵇康一辈子都在证明什么？他在洛阳街头打铁，不理会钟会——那不是傲慢，是他在做自己的主。真正的'证明'不需要观众：你埋头做事的样子，比你回击的每一句话都有力。若你发现自己所有的努力都指向'气死他'，那你就被他定义了。傲骨是脊梁，不是杠铃。"}
]},
{
id:10, gate:"规箴", title:"团队散了，你喊不喊？",
scene:"项目连败三个月，士气跌到谷底。会上人人低头玩手机。你是老资历，大家其实在等你说话。",
st:"过江诸人，每至美日，辄相邀新亭，藉卉饮宴。周侯中坐而叹曰：「风景不殊，正自有山河之异！」皆相视流泪。唯王丞相愀然变色曰：「当共戮力王室，克复神州，何至作楚囚相对！」",
sz:"南渡的名士们，每逢好天气，常在新亭相聚，坐在草地上饮酒。周顗席间感叹：风景没什么不同，只是山河已经变了！众人相视流泪。只有王导变了脸色说：应当一起为王室尽力，收复中原，何至于像囚徒一样相对哭泣！",
opts:[
 {t:"站起来说话，给大家打气", p:"雅", j:"你开口了，你就是那个王导。他没哭，不是不难过，是知道眼泪不解决问题——'何至作楚囚相对'，这句话救了新亭，也定了东晋的调子。打气不是喊口号，是先承认'风景不殊'的痛，再给出'克复神州'的路。你刚才做的，正是把一群哭的人变成了做事的人。这个团队有没有救，一半看项目，一半看你这样的人还在不在。"},
 {t:"不说话，但默默把活干完", p:"归", j:"你选择用行动说话。陶潜在东晋乱世里，从不参加新亭式的聚会——他回家种地，把每一天过好。沉默的实干者是一个团队的压舱石，只是你要确认：你的沉默是因为'不必说'，还是'不敢说'？若是后者，那颗压舱石迟早会压到自己心上。团队需要王导，也需要陶潜，但陶潜的活法，是在自己的田里，不是在别人的烂摊子里。"},
 {t:"跟着叹气，然后说'再看看吧'", p:"郁", j:"你叹了口气，说'再看看'。阮籍在新亭的话，会跟周顗一样——他看见的是山河之异，是注定的败局。但郁有两种：一种郁完照旧，一种郁完动手。你叹气的三秒里，大家其实都在看你：他们等的不是解决方案，是第一个说'咱们干吧'的人。你不说，别人也不说，团队就在'再看看'里散了。阮籍穷途之哭是因为无路可走；你有路，只是还没迈步。"}
]},
{
id:11, gate:"捷悟", title:"领导的暗示，你接得住吗？",
scene:"领导在群里发了一条没头没尾的消息，配了个表情。别人都在装懂，你大概猜到了他的意思。说破？还是装傻？",
st:"人饷魏武一杯酪，魏武啖少许，盖头上题「合」字以示众。众莫能解。次至杨修，修便啖，曰：「公教人啖一口也，复何疑？」",
sz:"有人送给曹操一杯奶酪，曹操吃了一点，在盖子上写了个'合'字给大家看。众人都不解其意。传到杨修那里，杨修拿起就吃，说：主公让大家每人吃一口，还有什么疑问？",
opts:[
 {t:"点破——让领导知道我看懂了", p:"逸", j:"你读懂了'合'字，还当众点破，这是杨修的路——他一生聪慧，最后死在聪明上。曹操杀杨修，不是因为他猜对了，是因为他让所有人都知道他能猜对。在权力的桌面上，'看懂'是本事，'显摆看懂'是催命符。你点的这一破，领导心里可能记你一笔：可用其才，不可近其身。聪明要配一点糊涂才安全——这是杨修用命换来的教训，你别用前程去换。"},
 {t:"看懂但不说破，私下做事", p:"和", j:"你看懂了，却只是默默配合。这是王导式的圆融：他在新亭不哭，在朝堂上装'愦愦'，心里比谁都清楚。看不懂的会干活，看得懂的会做人，既看懂又不说破的，才能掌局。你刚才的沉默不是窝囊，是分寸。只是要留个底：别让'懂'变成只进不出的囤积——领导需要一个看得懂他的人，也需要一个愿意说给他听的人，你挑准时机说一句，胜过平时说一百句。"},
 {t:"没看懂，但跟着大家吃", p:"郁", j:"你其实没看懂那个'合'字，但看大家都吃了，你也吃了——吃完了还心虚。这不可耻，杨修的聪明是天赋，你的迟钝是常态。可耻的是吃完还装懂。阮籍在朝堂上一醉六十日，是因为他不想掺和；你若不懂，最好的选择是真诚地小声问一句'这啥意思'——问，是求知；装，是欠债。你欠下的每一次'装懂'，都会在将来某个'合'字上连本带利找回来。"}
]},
{
id:12, gate:"夙惠", title:"孩子问你一个扎心的问题",
scene:"孩子突然问：爸爸/妈妈，你老了是不是就看不见我了？你心里一紧。",
st:"晋明帝数岁，坐元帝膝上。有人从长安来，元帝问洛下消息，潸然流涕。明帝问何以致泣，具以东渡意告之。因问明帝：「汝意谓长安何如日远？」答曰：「日远。不闻人从日边来，居然可知。」元帝异之。明日集群臣宴会，告以此意，更重问之。乃答曰：「日近。」元帝失色曰：「尔何故异昨日之言邪？」答曰：「举目见日，不见长安。」",
sz:"晋明帝几岁时，坐在父亲元帝膝上。有人从长安来，元帝问起中原的消息，流泪不止。明帝问为什么哭，元帝把南渡避乱的事告诉他，又问他：你觉得长安和太阳哪个远？明帝说：太阳远，从没听说有人从太阳那边来。元帝很惊异。第二天宴会上又问，明帝却答：太阳近。元帝变色：怎么跟昨天说的不一样？明帝说：抬头就能看见太阳，却看不见长安。",
opts:[
 {t:"认真回答，把生死讲给他听", p:"雅", j:"你没有糊弄他，而是把这个问题当成一个大问题来对待——这正是孩子最需要的。晋明帝那句'举目见日，不见长安'，震撼的不是答案，是一个孩子认真的重量。你认真回答的那一刻，孩子学到的不只是答案，是'我的问题值得被认真对待'。这比任何早教都贵重。雅量不只是大人的镇定，也是愿意蹲下来，用孩子的眼睛看世界。"},
 {t:"笑着岔开，说'还早着呢'", p:"和", j:"你岔开了，因为你自己也没想好答案。王导在朝堂上装愦愦，是政治智慧；对孩子装糊涂，是人之常情——你不是不想答，是怕答不好。但孩子的问题不会消失，只会换一种方式再来：青春期、离家、你生病时，它会一次比一次难答。与其等它长大，不如现在就给它一个小号的答案：'我会一直在你身边很久很久，久到你已经不怕了。'"},
 {t:"实话实说：'都会老的，但爱不会'", p:"归", j:"你说了实话，还加了一句自己的答案。陶潜写'死去何所道，托体同山阿'，是看透了生死才有的平静——他告诉孩子，也告诉自己：人会走，但走过的路、说过的话、爱过的人，会留在山阿之间。你能说出'爱不会'，说明你心里已经和'老'这件事讲过和了。孩子也许听不懂，但他会记住你当时的语气——那比任何答案都重要。"}

sz:"陶侃年轻时有大志，家里极穷。名士范逵来投宿，当时连日冰雪，陶侃家徒四壁，范逵却带着很多车马仆从。母亲对陶侃说：你只管出去留客，我来想办法。湛氏一头及地长发，剪下来做成两副假发卖了，换回几斛米。又砍下屋柱的一半当柴，把草席剁碎喂马。晚上，竟摆出了丰盛的饭食。",
opts:[
 {t:"好好混，用出息回报她", p:"雅", j:"你把'出息'当成了还债的方式，这是最朴素也最沉重的爱。湛氏卖头发时没有犹豫，因为她算的不是账，是儿子。谢安一生为家族谋划，也是这个逻辑：家族的荣光，是给先人的还礼。但你要小心：别把'出人头地'变成自我绑架——她卖头发，不是要你赎她，是要你成人。你过得踏实、睡得安稳，就是她卖头发最想换的东西。回报不用轰轰烈烈，先把自己过好。"},
 {t:"陪她——钱以后再说", p:"归", j:"你选择了把时间留给她，而不是把成就寄给她。陶侃后来封侯拜将，但他母亲没等到那一天——湛氏去世时，陶侃还在荆州。陶潜想明白了这个道理：'往者不可谏，来者犹可追'，他归隐，一半是为了自己，一半是为了在父母坟前不后悔。你选陪伴，是怕'子欲养而亲不待'。这个选择没有错，只是记住：她把头发卖了，不是让你愧疚，是让你别回头——你过得好，她卖得值。"},
 {t:"拼命赚钱，给她最好的", p:"郁", j:"你拼命赚钱，给她买她永远不会用的东西，因为钱是你能给出的最直白的证明。阮籍对母亲的爱，也是这种笨拙的浓度——他不按礼法哭，却吐血数升。笨拙的爱不是错，错的是它常常迟到：你以为还有十年，其实可能只有三年。湛氏卖头发那晚，陶侃一定也想过'等我发达了'——但他后来发达了，能做的也只是把她的事迹讲给天下人听。别只讲给天下人，讲给她。"}
]},
{
id:20, gate:"术解", title:"焦虑的时候，你求过什么？",
scene:"最近诸事不顺：工作卡壳、感情冷战、体检有个小指标异常。你深夜刷到占卜直播，鬼使神差地点了进去。",
st:"郭璞好经术，博学有高才，而讷于言论，词赋为中兴之冠。好古文奇字，妙于阴阳算历。有郭公者，客居河东，精于卜筮，璞从之受业。公以《青囊中书》九卷与之，由是遂洞五行、天文、卜筮之术，攘灾转祸，通致无方。",
sz:"郭璞博学多才，精于阴阳历算、卜筮之术。有位郭公精通占卜，把《青囊中书》九卷传给他，从此郭璞通晓五行天文、卜筮之法，能消灾转祸。但术数再精，也算不穿世道人心的无常。",
opts:[
 {t:"当娱乐——算着玩，不信", p:"逸", j:"你把它当深夜的娱乐节目，算完一笑，该干嘛干嘛。王羲之也服五石散、也讲养生，但他从不把命交给方士——他信的是手里的笔。'信而不迷'是聪明人的玩法：占卜给你一个'可能'，你自己决定要不要接。但给自己立个规矩：算完不查'第二次'——反复占卜的人，不是想要答案，是想要安慰，而安慰这东西，越算越不够。"},
 {t:"有点信——求个心理安慰", p:"和", j:"你信一点，因为你需要一个'不是我的错'的出口。王导掌权时也信卜筮——他要处理太多无法解释的变故，术数是他给朝野的镇定剂，也是给自己的。信一信没什么，人总得有个地方安放'我控制不了'的恐慌。但你要盯住一个分界线：占卜的结果，是拿来参考的，还是拿来当借口的？'卦象说我们不合适'——这话你信三分，就是给自己留了七分的退路。退路可以有，别退成习惯。"},
 {t:"迷——事事都要先问", p:"郁", j:"你已经把'问'当成了生活的前置程序：出行问、工作问、恋爱问。郭璞精通术数，却从不靠它活——他最终死在卜筮之外的人事纷争里。术数救不了他，也救不了你。郁的人求签，求的不是方向，是'有人替我做决定'的解脱。阮籍也迷玄学，但他迷的是'道理'，不是'命运'——他从不把人生交给卦象，他宁可醉。你也别把人生交给卦象：卦象不替你活，它连自己都活不明白。"}
]},
{
id:21, gate:"巧艺", title:"细节控，是病还是天赋？",
scene:"你交的方案被夸'漂亮'，但你知道：那个数据对齐、那个字距，你调了二十遍。同事笑你'太较真'。",
st:"顾长康画裴叔则，颊上益三毛。人问其故，顾曰：「裴楷俊朗有识具，正此是其识具。」观者寻之，定觉益三毛如有神明，殊胜未安时。",
sz:"顾恺之给裴楷画像，在脸颊上加了三根毫毛。别人问他为什么，他说：裴楷俊朗有见识，这三根毫毛正是他的'见识之相'。观画的人仔细端详，果然觉得加上三根毫毛后，画像如有神明，远胜没加的时候。",
opts:[
 {t:"较真就对了——细节即神明", p:"逸", j:"你调那二十遍，不是强迫症，是顾恺之的'颊上三毛'——别人看不出差别，但'神明'就在那三根毛里。顾恺之说得很清楚：那不是乱加，是裴楷这个人'识具'所在。你的较真若真服务于'这个人/这件事的样子'，它就是天赋；若只是怕出错，它就是消耗。区分方法很简单：调完第二十遍时，你是满足，还是空虚？满足，就继续；空虚，就停在第几遍都一样。"},
 {t:"差不多就行——别内耗", p:"和", j:"你选择'差不多得了'，因为你在心里盘算过：这二十遍的时间，够我做三件别的事。王导理政也讲'镇之以静'——他不抠细节，他抠方向，方向对，细节会自己归位。这不是懒，是优先级管理。但你要警惕另一种'差不多'：不是看淡了，是看怕了——怕自己永远调不满意。前者是王导，后者是逃避。你问自己一个问题：如果这件作品代表你，你还'差不多'吗？"},
 {t:"又爱又恨——不较真难受，较真又累", p:"郁", j:"你卡在中间：知道较真是病，又放不下那个'神明'。阮籍写诗也是这样——他反复推敲，又假装漫不经心，因为认真是他最深的软肋。卡住的人最累，但顾恺之给了你一个解药：他加三毛，不是追求完美，是追求'像'。把目标从'完美'改成'传神'，你的二十遍就会变成五遍，而神明还在。较真不是病，拿较真折磨自己才是。"}
]},
{
id:22, gate:"宠礼", title:"领导特别偏爱你了",
scene:"新领导特别欣赏你，好事都想着你，也常单独叫你谈话。同事们开始酸你：'人家是红人。'",
st:"王丞相拜司空，桓廷尉作两髻、葛裙、策杖，路边窥之，叹曰：「人言阿龙超，阿龙故自超！」不觉至台门。",
sz:"王导被拜为司空时，桓彝扎着两个发髻，穿着葛布裙，拄着手杖在路边偷看他的仪仗，感叹说：人都说阿龙超群，阿龙果然超群！不知不觉竟跟到了台城门下。（桓彝素来清高，也被王导的风采折服。）",
opts:[
 {t:"受着——有机会就上", p:"雅", j:"你接住了这份偏爱，因为你知道它是凭本事挣来的。谢安也是'红人'——桓温想拉拢他，皇帝信重他，他通通接住，然后用在正道上。被偏爱不可耻，可耻的是把偏爱当饭票。你该做的是谢安式回应：领导给一分，你做出三分，让所有人看见这偏爱'值这个价'。流言会自己消散——只要你的成绩单一直比流言长。"},
 {t:"避嫌——我不想成为靶子", p:"和", j:"你选择了低调：好事推一推，私下谈话也尽量公开化。王导在朝堂上被偏爱了一辈子——'王与马，共天下'——他活下来的秘诀就是：得宠时更谨慎，风光时不招摇。你避嫌不是怂，是看懂了人性：办公室里的嫉妒，不比朝堂上的刀温柔多少。但避嫌要有个度：如果你把该得的也推光，同事们不会觉得你高尚，只会觉得你'好欺负'——偏爱可以让，机会别让。"},
 {t:"趁机多得点——反正他有求于我", p:"郁", j:"你开始盘算怎么把这份偏爱变现：多要点资源、多揽点好处。这是危险的信号——不是道德上危险，是心理上危险。阮籍被司马昭偏爱（想跟他结亲），他的回应是连醉六十日，把这份'宠'生生醉掉了——因为他知道，被偏爱的人最容易被绑架。领导的偏爱是糖，也是钩子。你可以接糖，但要看清楚：他偏爱你，是因为你能办事，还是因为你听话？前者可以长期合作，后者迟早要还。"}
]},
{
id:23, gate:"任诞", title:"想疯一次，敢不敢？",
scene:"深夜十一点，你突然特别想去看海。明天还有早会。理智说：回去睡觉。心里有个声音说：去。",
st:"王子猷居山阴，夜大雪，眠觉，开室命酌酒，四望皎然。因起彷徨，咏左思《招隐诗》。忽忆戴安道，时戴在剡，即便夜乘小船就之。经宿方至，造门不前而返。人问其故，王曰：「吾本乘兴而行，兴尽而返，何必见戴！」",
sz:"王徽之住在山阴，夜里大雪，醒来后命人斟酒，四望一片皎白。他起身徘徊，吟咏左思的《招隐诗》，忽然想起戴逵，当时戴逵在剡县，便连夜乘小船去访。走了一夜才到，到了门口却不进去，掉头回来了。别人问他为什么，他说：我本来乘兴而来，兴尽而归，何必非要见戴逵！",
opts:[
 {t:"去——人生难得几回疯", p:"逸", j:"你去了。王徽之划了一夜船，到门口就回，全程没见到人——但他这一夜是完整的：雪、酒、诗、船、思念、抵达、转身。这六个动作做完，他的人生又多了一页'兴尽而返'。你去看海也一样：明天早会会结束，但'我深夜去看过海'这件事不会。逸的人最懂：人生不是打卡，是几帧值得回放的画面。去之前记得发个定位，别让自己孤独地疯。"},
 {t:"算了——睡醒又是打工人", p:"和", j:"你没去，因为你已经在心里算好了账：往返三小时，明早八点开会，精神不好要挨骂。王导式的人生哲学：情绪是贵的，稳定是省的。这账算得没错，错的是你算完账之后的那个叹气——那个叹气里藏着一个没去成的海。人不能永远'算了'。你可以给'算了'设个预算：每个月，至少允许自己'疯'一次，金额不限，主题不限。让那个海，在别的时间、别的形式里，到达。"},
 {t:"纠结到天亮，最终没去", p:"郁", j:"你纠结了一夜：一会查潮汐，一会看车票，天亮了，你还是没去，然后恨自己。这太像阮籍了——他每次'驱车出门'都走得很远，但走到穷途就哭：他有一半的夜晚，都消耗在'去还是不去'之间。郁的人不是没有冲动，是冲动都用来折磨自己了。给你的解药是王徽之的三个字：'即便'——便是'马上'的意思。下次再有这个念头，不查潮汐、不看车票，穿上外套就出门。冲动是有保质期的，你要赶在保质期前出门。"}
]},
{
id:24, gate:"简傲", title:"有人来'请教'，其实是来试探",
scene:"那个总跟你不对付的同事，忽然笑着来找你'请教问题'，还带着一包好烟。你心里警铃大作。",
st:"钟士季精有才理，先不识嵇康。钟要于时贤俊之士，俱往寻康。康方大树下锻，向子期为佐鼓排。康扬槌不辍，傍若无人，移时不交一言。钟起去，康曰：「何所闻而来？何所见而去？」钟曰：「闻所闻而来，见所见而去。」",
sz:"钟会精于才理，之前不认识嵇康。他邀约当时的贤俊之士，一起去看嵇康。嵇康正在大树下打铁，向秀在旁边拉风箱。嵇康扬着铁锤打个不停，旁若无人，很久不说一句话。钟会要走，嵇康问：你听到什么来的？看到什么走的？钟会说：听到所听到的来，看到所看到的走。",
opts:[
 {t:"冷淡应对——无事不登三宝殿", p:"傲", j:"你选择了嵇康：继续打你的铁，不抬头。钟会带着一帮人来'拜访'，嵇康一眼看穿：这不是请教，是试探。你冷他，是告诉他：你的烟买不到我。但你要记住嵇康的代价——钟会走后记恨在心，后来嵇康之死，钟会的谗言是那把刀。傲骨若没有'防身术'，就是把自己交到对手手里。你可以冷淡，但冷淡的同时，把该守的阵地守好：不授人以柄，就是最好的防御。"},
 {t:"热情接待——多个朋友多条路", p:"和", j:"你笑着接了他的烟，聊得很热络。王导一辈子都在接这种'烟'——他是调和鼎鼐的人，跟谁都能坐下聊，包括暗中想搞他的人。接烟不等于缴械：你可以热络，但心里那本账照记。王导的热络是手腕，不是真心——他谁都不得罪，因为谁都可能是明天的盟友。你唯一要防的，是热络成了习惯，连自己都分不清真假：到那时，你就真成了钟会要的那种'可对付的人'。"},
 {t:"不冷不热——先看看他想干嘛", p:"郁", j:"你接了烟，但话不多，心里在盘算：他到底图什么？阮籍对钟会这样的人，用的正是这一招——钟会去问他对时事的看法，他喝得大醉，一个字不吐。不冷不热是最好的缓冲：既不结仇，也不缴械。但郁的陷阱是：缓冲久了，你会连'可以信任谁'都忘了。你可以对钟会设防，但别忘了给真朋友留门——否则你的防线，会变成所有人的墙。"}
]}
];

/* 澄怀 · 世说镜鉴录 — 36 门处境镜鉴数据（25-36）*/
/* p: 傲(嵇康) 郁(阮籍) 雅(谢安) 逸(王羲之) 和(王导) 归(陶潜) */
const MIRRORS_PART3 = [
{
id:25, gate:"排调", title:"被人开过分的玩笑",
scene:"聚餐时，有人拿你的痛点开玩笑，全场大笑，只有你笑不出来。回嘴，显得没幽默感；不回，心里憋屈。",
st:"邓艾口吃，语称「艾艾」。晋文王戏之曰：「卿云『艾艾』，定是几艾？」对曰：「『凤兮凤兮』，故是一凤。」",
sz:"邓艾口吃，说话总说'艾、艾'。晋文王开玩笑说：你说'艾艾'，到底是几个艾？邓艾答道：古人说'凤兮凤兮'，其实还是一只凤。",
opts:[
 {t:"回个漂亮的——用幽默化解", p:"逸", j:"你回了一句让全场更响亮的漂亮话，把'被笑话'变成了'会接梗'。邓艾的'凤兮凤兮'是教科书级回应：他没有解释'我不是口吃'，而是把嘲笑变成了典故——'凤兮凤兮，故是一凤'，意思是：艾艾，也只是一个艾，正如凤凤，也只是一只凤。你用幽默接住刀子，不是示弱，是告诉他：你的刀，只能插在笑话上，插不进我心里。这一手可以练——先备几句'万能接梗'，下次就不慌了。"},
 {t:"当场翻脸——开玩笑要有分寸", p:"傲", j:"你翻了脸，因为你的痛不是玩笑素材。嵇康对钟会'移时不交一言'，也是这种态度：我不接受你用我来表演。翻脸是有代价的——全场会冷场，有人会说你'开不起玩笑'。但你得想清楚：让全场暖，还是让自己立住？嵇康选了后者，代价是孤独，得到的是敬畏。你翻一次脸，大家就记住了你的底线，下次再开你玩笑前会犹豫三秒——这犹豫，就是你的胜利。不过，翻脸要说人话：'这个梗，我不接。'一句就够。"},
 {t:"忍了——苦笑一下", p:"郁", j:"你跟着苦笑了一下，胃里却拧成一团。阮籍最懂这种笑——他面对司马昭的试探，永远是这种笑：不接话，不翻脸，醉过去。忍，是你的自我保护：你可能不想撕破关系，也可能只是来不及反应。但郁的人有个通病：把忍下来的话，攒着，攒到某天一件小事上突然爆发，然后所有人都觉得你莫名其妙。别攒。今晚或者明天，找个私下的时机，平静地告诉那个人：'那天那个玩笑，我不太舒服。'——不翻脸，但要说。"}
]},
{
id:26, gate:"轻诋", title:"你发现朋友在背后说你",
scene:"你无意中看到群聊截图，关系不错的朋友在背后吐槽你。你握着手机，手指冰凉。",
st:"王丞相末年略不复省事，正封箓诺之。自叹曰：「人言我愦愦，后人当思此愦愦。」",
sz:"王导晚年不再怎么过问政事，只在文件上签字画诺。他自我感叹：人们都说我糊涂，后人应当会想念这种糊涂。",
opts:[
 {t:"当面问清楚——别让误会过夜", p:"雅", j:"你把他约出来，开门见山：'我看到了，想听你亲口说。'这是最难也最干净的路。谢安处理矛盾的方式就是这样——不猜，不问第三方，当面谈。当面问有个好处：对话一旦开始，真相就藏不住了——他要么解释，要么道歉，要么沉默，你总能拿到答案。雅量不是不受伤，是受伤后依然选择正面对话。记住：问的时候只问事实，别问'你凭什么'——那会把对话变成审判。"},
 {t:"不动声色——看他下一步", p:"和", j:"你握着手机，但没发火，也没问。你把截图存好，继续和他正常相处，但心里那杆秤已经动了。王导处理朝堂暗流就是这个路数：装愦愦，装不知道，暗地里把棋子摆好。不戳破的好处：你能看到完整的真相——他是一时失言，还是惯常如此；你会知道该防他几分。但王导的愦愦有一个前提：他从不把这种愦愦用在真朋友身上。你要分清：这个人是你的盟友，还是你的同事？前者，别用策略，用坦诚。"},
 {t:"默默疏远——不吵不闹不解释", p:"郁", j:"你选择了沉默地拉开距离：消息回慢了，聚会不去了，关系自然冷却。阮籍对看透的人，就是这样——不指责，不解释，用距离说话。这是温柔的绝交，也是郁式的孤独：你保护了自己，但也失去了一次看清真相的机会。更要注意的是：别让疏远变成冷战——冷战是两个人的事，你单方面降温，对方只会觉得你'莫名其妙变脸'。如果你还想留这段关系，就给他一个'为什么'；如果不想留，就给自己一个'为什么'，然后干净地放下。"}
]},
{
id:27, gate:"假谲", title:"善意的谎言，说吗？",
scene:"朋友的项目快黄了，你提前知道了消息。他还在兴致勃勃地跟你讲他的计划。告诉他？还是让他再高兴几天？",
st:"魏武行役，失汲道，军皆渴，乃令曰：「前有大梅林，饶子，甘酸可以解渴。」士卒闻之，口皆出水，乘此得及前源。",
sz:"曹操行军时，找不到水源，全军口渴。曹操下令说：前面有一大片梅林，梅子很多，又酸又甜，可以解渴。士兵听了，嘴里都冒出酸水，凭这股劲，终于赶到了前面的水源。",
opts:[
 {t:"告诉他——真相早说早好", p:"雅", j:"你选择说真话，但把真话说得软：'项目有变，你要早做准备。'曹操的望梅止渴是骗局，但谢安不用骗局——他面对桓温的刀，选择的是当面博弈。说真话的难处不在'说'，在'说的时间'：早说，他还有转身的余地；晚说，他就成了最后一个知道的人。你早点告诉他，他或许会难过几天，但十年后他会谢你那天晚上说的那句话。真话的价值，不在于动听，在于它给了对方时间。"},
 {t:"先不说——让他过几天好日子", p:"郁", j:"你选择了沉默，理由很温柔：让他再高兴几天。这像曹操的梅子——甜，但是假的。郁的人最会替别人着想，也最怕当面伤害别人。但你要想清楚：这'几天好日子'，是用什么换的？是他的准备时间。他晚知道三天，就少三天的转圜余地——那三天的价值，可能大于他这几天的高兴。如果你决定不说，就请承担起'帮他兜底'的责任：真到那天，你要在他身边，而不是躲在'我早就知道'的阴影里。"},
 {t:"真假掺半——先探他的口风", p:"和", j:"你没直接说，你绕着问：'最近项目怎么样？有没有什么风声？'——你想从他的话里判断他能不能承受真相。这是王导式的试探：先探水深，再决定下不下河。王导一辈子都在这样周旋——他不说破，但把信息一点点漏出去，让对方自己领悟。这是聪明的做法，但有个副作用：他可能会把'你话里有话'听成别的意思，猜错了方向。试探要有终点：探完，还是要给的。给他一个'无论结果如何，我都在'的承诺，比绕圈子有用。"}
]},
{
id:28, gate:"黜免", title:"失业了，你怎么过？",
scene:"裁员名单上有你。HR 谈完话，你抱着纸箱走出写字楼。阳光很刺眼。你今年 35。",
st:"殷中军被废，在信安，终日恒书空作字。扬州吏民寻义逐之，窃视，唯作「咄咄怪事」四字而已。",
sz:"殷浩被废黜后，住在信安，整天用手指在空中写字。扬州的小吏百姓追着他看，偷偷观察，只见他反反复复写的，只是'咄咄怪事'四个字而已。",
opts:[
 {t:"当天难过，明天投简历", p:"雅", j:"你允许自己难过一晚上，然后开始投简历。殷浩被废后整天书空'咄咄怪事'——他至死没想通自己为什么输。但你不一样，你已经在做谢安式的复盘：先接受，再计算。谢安被排挤出山时也低落过，但他把东山的日子过成了'蓄力期'——后来天下需要他时，他随时能出。失业不是你的失败，是你这段赛程的暂停键。明天把简历改到深夜的那盏灯，就是你东山再起的第一个台阶。"},
 {t:"先歇一个月——补上这些年欠的觉", p:"归", j:"你决定先不急着找工作，给自己一个空窗期。陶潜辞官后不是马上想出路，而是先'归去来兮'——回老家，把欠自己的日子过回来。社会时钟催你'无缝衔接'，但陶潜说：田园将芜胡不归？你这些年欠身体的觉、欠家人的饭、欠自己的黄昏，都是时候补了。但陶潜的空窗期是有底的——他有田可种；你也一样，先算好'田'：存款、技能、人脉。空窗期的每一天，都要真的在补觉，而不是在焦虑中刷手机。"},
 {t:"表面淡定，心里慌得一批", p:"郁", j:"你跟家人说'没事，正好休息'，晚上却睁眼到三点，脑子里全是房贷和简历。殷浩的'咄咄怪事'，是你现在的心情：我不信，我怎么会走到这一步。郁的人最要命的是：把恐慌藏得太深，深到连自己都骗过去了。给你个具体动作：把最坏的情况写下来——房贷、开销、存款、能撑几个月，写清楚。恐惧这东西，一落纸就缩水一半。你算完会发现：你的'怪事'，其实有解。阮籍穷途而哭，哭完还是要找路的。"}
]},
{
id:29, gate:"俭啬", title:"钱，该花还是该省？",
scene:"工资到账。你妈说：攒着。你朋友说：人生苦短。你看着购物车里那件犹豫了一个月的大衣，发呆。",
st:"王戎俭吝，其从子婚，与一单衣，后更责之。家有好李，卖之，恐人得其种，恒钻其核。",
sz:"王戎生性吝啬。侄子结婚，他只送了一件单衣，后来还要了回来。家里有好李树，卖李子时怕别人得了种子，每次都把李核钻破才卖。",
opts:[
 {t:"该花就花——钱是赚出来的不是省出来的", p:"逸", j:"你买了那件大衣，因为你知道它会让你在每个穿它的早晨心情变好。王羲之对钱的看法就八个字：'我卒当以乐死'——钱要花在让此生有滋味的地方。逸的人不是不理财，是算'快乐收益率'：一件大衣穿三年，每天折算几毛钱，换来的是无数个好心情的早晨，这账怎么算都不亏。但逸不等于散财——王羲之也有他的'园田'经营。买，但只买让你心动的东西，不为'打折'心动。"},
 {t:"攒着——安全感比大衣值钱", p:"和", j:"你没买，你把它存成了'底气基金'。王导出身琅琊王氏——顶级豪门——但他当政时不铺张，靠的是'慎'字。攒钱的人不是抠，是见过生活的无常：裁员、生病、意外，都不打招呼。你把安全感存进数字里，这没错。但王戎的教训要记住：钻李核的吝，和存钱的慎，隔着一条线——前者是怕人占便宜，后者是怕自己没底气。你检查一下动机：攒钱的时候，心里是踏实，还是恐慌？踏实就继续，恐慌就说明你在用钱填一个填不满的洞。"},
 {t:"时花时省——没准头", p:"郁", j:"你一会'人生苦短'清空购物车，一会'下月省着点'吃泡面——钱花得没有章法，心里也从来没有安全感。阮籍纵酒，是拿银子换醉——他不是理财，是疗伤。你的忽花忽省，也是在疗某种伤：可能是压力，可能是空虚。给你一个工具：设'快乐账户'和'底气账户'——每月工资一到，先各存一笔，剩下的随便花。两条腿走路，你就不用每次都站在'该花还是该省'的悬崖边纠结了。"}
]},
{
id:30, gate:"汰侈", title:"朋友圈里都在秀",
scene:"老同学晒新买的表，同事晒马尔代夫，连楼下邻居都在晒新提的车。你看着自己的工位，觉得哪哪都灰扑扑的。",
st:"石崇与王恺争豪，并穷绮丽，以饰舆服。武帝，恺之甥也，每助恺。尝以一珊瑚树高二尺许赐恺，枝柯扶疏，世罕其比。恺以示崇。崇视讫，以铁如意击之，应手而碎。恺既惋惜，又以为疾己之宝，声色甚厉。崇曰：「不足恨，今还卿。」乃命左右悉取珊瑚树，有三尺、四尺，条干绝世，光彩溢目者六七枚，如恺许比甚众。",
sz:"石崇和王恺斗富，极尽奢靡。晋武帝是王恺的外甥，常暗中帮他。武帝赐给王恺一株二尺多高的珊瑚树，世间罕有。王恺拿给石崇看。石崇看完，用铁如意随手一击，珊瑚应声而碎。王恺既痛惜，又以为石崇嫉妒自己的宝物。石崇说：不值得遗憾，现在赔你。于是命人把家里的珊瑚树全搬来，有三尺四尺高的，光彩夺目的有六七株，像王恺那株那么大的更是数不清。",
opts:[
 {t:"不看——关掉朋友圈一阵子", p:"归", j:"你卸载了朋友圈，或者屏蔽了那几个'炫'的人。陶潜如果活在今天，一定是最早'关朋友圈'的人——他写'结庐在人境，而无车马喧'，问君何能尔？心远地自偏。他不是看不见车马，是不让车马进心里。你关掉的不是朋友圈，是那个拿别人生活当尺子量自己的'裁判'。但归隐也要归得干净：别一边卸载一边忍不住借别人的手机刷——那样你不是心远，是心痒。真正的放下，是就算看见，也只觉得'与我何干'。"},
 {t:"默默努力——把羡慕变成KPI", p:"雅", j:"你盯着那张表，然后默默打开了自己的计划表。谢安面对石崇王恺的奢靡是什么态度？他年轻时也游山玩水——但他从不参与斗富，因为他的赛道是'从容'：石崇斗富斗到满门抄斩，谢安东山再起功盖天下。你羡慕的东西，大多会过期；你为之努力的东西，不会。把'我也要买表'改成'我要做成一件事'——前者是消费，后者是积累。五年后，炫表的人还在炫表，做成事的人，已经有了自己的表。"},
 {t:"酸——凭什么他有我没有", p:"郁", j:"你在评论区打了一句'有什么了不起'，又删了。石崇的珊瑚树碎的时候，王恺的愤怒你完全懂：凭什么他比我多？但你看一眼结局：石崇斗富斗到最后，绿珠坠楼，满门抄斩。酸，是因为你把别人的拥有，当成了自己的缺失。阮籍酸过吗？他也羡慕过嵇康的'神姿'，但他的处理是写《咏怀诗》——把酸味酿成诗。你也找个出口：跑步、写作、哪怕记账。让酸味流出去，别让它腌着你。"}
]},
{
id:31, gate:"忿狷", title:"一件小事，你炸了",
scene:"外卖超时一小时，你打过去，对方还理直气壮。你摔了手机，又后悔——至于吗？",
st:"王蓝田性急。尝食鸡子，以箸刺之，不得，便大怒，举以掷地。鸡子于地圆转未止，仍下地以屐齿蹍之，又不得，瞋甚，复于地取内口中，啮破即吐之。",
sz:"王述性子急。有一次吃鸡蛋，用筷子去扎，没扎着，大怒，把鸡蛋举起来摔在地上。鸡蛋在地上转个不停，他又用木屐的齿去踩，又没踩到，更加愤怒，捡起来塞进嘴里，咬破就吐了。",
opts:[
 {t:"当场爆炸——痛快但后悔", p:"傲", j:"你炸了，吼了几句，挂断电话，三分钟后开始后悔。王述摔鸡蛋的每一步你都熟：扎不住→怒→摔→踩→再怒→塞嘴里→吐掉——愤怒走了全套流程，鸡蛋还是没吃到。傲的人脾气大，是因为对自己的要求高，容不得失控感。但你要分清：对外卖员发火，和你对自己发火，是两件事。下次想炸的时候，给自己一个'三秒规则'：先深呼吸三次再开口。三次呼吸的时间，足够你想清楚：他错，投诉他；我炸，伤的是我自己。"},
 {t:"忍——但回家生闷气", p:"郁", j:"你礼貌地说'好的，我等着'，挂掉电话，然后一晚上都在脑内重播这场战争。阮籍的愤怒从来不直接发作——他'白眼'对人，把情绪都酿成了酒和诗。忍是美德，但'忍完不消化'是慢性毒药。你需要的不是'别生气'，是'把气送走'：跑三公里、写几百字、或者把外卖这件事投诉到底——选一样，把气用掉。郁的人最怕的不是生气，是气生完了，事还在心里搁着，夜夜发酵。"},
 {t:"有火但不冲人——先缓后算账", p:"雅", j:"你没冲他吼，你挂断电话，缓了五分钟，然后平静地投诉、申请赔付、写差评。这是谢安的'泛海'心法：风浪起来时先稳住船，等风浪过去再算航向。雅的人不是没火，是把火存进了'算账'里——王述摔鸡蛋是因为火没处去；你有处去：流程、规则、赔付，都是你的'铁如意'。但提醒一句：缓完一定要'算'——如果每次都是缓完就算了，那不叫雅量，叫习惯了忍气吞声。你的投诉不是报复，是让规则替你说句话。"}
]},
{
id:32, gate:"谗险", title:"有人在领导耳边说你坏话",
scene:"你听说同事在领导面前'不经意'提了一句你的'失误'——那件事你明明处理得没问题。你查了一下，发现他已经不是第一次了。",
st:"钟会稽康名重一世，而所与交者，唯阮籍、山涛、向秀、刘伶、阮咸、王戎辈。钟会言于文帝曰：「嵇康，卧龙也，不可起。公无忧天下，顾以康为虑耳。」因谮康欲助毋丘俭，帝遂害之。",
sz:"嵇康名重一时，所交的都是阮籍、山涛等名士。钟会向晋文帝进言说：嵇康是卧龙，不可让他起来。您不必忧心天下，只需要防着嵇康就够了。又诬陷嵇康想帮助毋丘俭谋反，文帝于是杀了嵇康。",
opts:[
 {t:"对质——当面把话摊开", p:"雅", j:"你把他约到茶水间，平静地说：'我听说你在领导面前提了那件事，我想当面确认一下。'——不指控，只求证。谢安面对桓温的构陷，选择的是'主动过江'当面博弈：与其猜，不如当面摆明车马。对质的好处：他要么否认，要么承认，要么狡辩——你总能看清他的质地。但记住对质的火候：只在'他知道你知道'时有效。别在公开场合对质，那会把你的有理变成'气急败坏'。茶水间，两个人，一句'我想确认'，就够了。"},
 {t:"不动声色——先把证据攒起来", p:"和", j:"你没找他，你开始记录：他提过哪些话、什么场合、什么人也在场——全部记下来。王导在朝堂上面对无数暗箭，靠的就是一本看不见的账：他知道谁说过什么，谁做过什么，但从不提前翻开。攒证据不是要报复，是给自己留'防身'——将来对质时，你有底气；真出事时，你有后手。但王导的账本从不用来害人，只用来自保——你要守住这条线：攒证据是为了澄清自己，不是为了搞垮别人。前者叫成熟，后者叫同流合污。"},
 {t:"忍——多一事不如少一事", p:"郁", j:"你选择算了：'他爱说就说吧，清者自清。'阮籍面对钟会们的试探，也是这样——用沉默和醉酒把自己包起来。清者自清在太平盛世成立，在'有人天天替你'不清'的时候，就是把自己交到别人手里。嵇康也以为清者自清——他至死没辩解，但钟会的那句话'卧龙不可起'，还是落到了文帝耳朵里。你可以不反击，但至少要留一扇门：让领导知道真相的版本里，有你的声音。不是让你去斗，是让你别在暗处消失。"}
]},
{
id:33, gate:"尤悔", title:"如果当初……",
scene:"你做了一个错误的决定，后果已经无法挽回。你一遍遍复盘：如果当时选另一个选项就好了。",
st:"王导为丞相，周顗为王敦所害。后王导见周顗之尸，泣曰：「吾虽不杀伯仁，伯仁由我而死。幽冥之中，负此良友！」",
sz:"周顗被王敦杀害后，王导见到他的尸首，哭着说：我虽然没有杀伯仁，伯仁却因我而死。在九泉之下，我辜负了这个好朋友！（当年王导有难，周顗曾在皇帝面前力保他，却从不当面言说；王导不知，以为周顗见死不救，未加阻止。）",
opts:[

/* ============ 视图 ============ */
const V = document.getElementById('view');
function go(name){
  if(name === 'home') render();
  else if(name === 'how') renderHow();
  else if(name === 'result') renderResult();
  else if(name === 'mirror') renderMirror(parseInt(localStorage.getItem('chMirror'))||0);
}
function mirrorDone(id){ return S.done.indexOf(id) >= 0; }

function render(){
  dayInit();
  const n = S.done.length;
  document.getElementById('stDone').textContent = n + '/36';
  document.getElementById('stTitle').textContent = titleNow().n;
  document.getElementById('stDay').textContent = S.dayCount;
  let h = `<div class="sec-h"><span class="bar"></span><h2>🏮 <span data-l="gates">三十六门 · 三十六镜</span></h2><span class="bar"></span></div>`;
  h += `<div class="gates">`;
  for(const m of MIRRORS){
    const d = mirrorDone(m.id);
    h += `<div class="gate${d?' done':''}" onclick="openMirror(${m.id})">
      <span class="no">${String(m.id).padStart(2,'0')}</span>
      <span class="gn">${m.gate}</span>
      <span class="gt">${m.title}</span>
      <span class="ok">${d?'✓':''}</span></div>`;
  }
  h += `</div>`;
  h += `<div class="sec-h"><span class="bar"></span><h2>📜 <span data-l="daily">名士日课</span></h2><span class="bar"></span></div>`;
  const w = DAYWORDS[new Date().getDate() % DAYWORDS.length];
  h += `<div class="dayword"><div class="w">「${w[0]}」</div><div class="ws">—— ${w[1]}</div>`;
  h += `<div class="days">`;
  const checked = Math.min(S.dayCount, 81);
  for(let i=1;i<=81;i++){
    h += `<div class="day-chip${i<=checked?' on':''}" title="${i}天">${i<=checked?'✓':i}</div>`;
  }
  h += `</div>`;
  h += `<button class="btn primary" onclick="checkDay()">${S.dayCount>0?'<span data-l="again">今日已读，再诵一遍</span>':'<span data-l="check">今日诵此一言</span>'}</button></div>`;
  V.innerHTML = h;
  bindL();
  // 滚动提示
  window.scrollTo({top:0});
}
function checkDay(){
  S.dayCount += 1; save(); render();
}
function openMirror(id){
  localStorage.setItem('chMirror', id);
  renderMirror(id);
}
function renderMirror(id){
  const m = MIRRORS.find(x=>x.id===id);
  let h = `<a class="btn" onclick="render()">← <span data-l="back">镜门</span></a>`;
  h += `<div class="card">`;
  h += `<div class="g">${String(m.id).padStart(2,'0')} · ${m.gate} · ${m.gateEn||''}</div>`;

  h += `<div class="scene">${m.scene}</div>`;
  h += `<div class="story"><div class="s1">${m.st}</div><div class="s2">${m.sz}</div><div class="src">—《世说新语 · ${m.gate}》</div></div>`;

  for(let i=0;i<m.opts.length;i++){

  V.innerHTML = h;
  bindL();
  window.scrollTo({top:0});

  dv.innerHTML = `
    <div class="verdict">
      <div class="v-t">照见 · ${o.p} 型（${p.n}）</div>
      <div class="v-j">${o.j}</div>
      <div class="v-p">人格底牌 +1：${p.n} · ${p.d}</div>
    </div>
    ${next?`<button class="btn primary" onclick="openMirror(${next.id})">下一面镜 → ${next.gate}</button>`
          :`<button class="btn primary" onclick="renderResult()">三十六镜已照尽 · 观我名士像</button>`}
    <button class="btn" onclick="render()">返回镜门</button>`;
  dv.scrollIntoView({behavior:'smooth'});
}

/* ============ 雷达图 ============ */
function radarSVG(){
  const keys = KEYS, n = keys.length;
  const cx = 170, cy = 150, R = 108;
  const pts = (k)=>Array.from({length:n},(_,i)=>{
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    return [cx + Math.cos(ang)*R*k, cy + Math.sin(ang)*R*k];
  });
  let s = `<svg viewBox="0 0 340 300" xmlns="http://www.w3.org/2000/svg">`;
  const max = Math.max(1, ...keys.map(k=>S.scores[k]||0));
  for(let ring=1; ring<=4; ring++){
    const k = ring/4;
    const p = pts(k);
    s += `<polygon points="${p.map(x=>x.join(',')).join(' ')}" fill="none" stroke="rgba(138,106,53,0.25)" stroke-width="0.5"/>`;
  }
  for(let i=0;i<n;i++){
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    s += `<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(ang)*R}" y2="${cy+Math.sin(ang)*R}" stroke="rgba(138,106,53,0.25)" stroke-width="0.5"/>`;
  }
  const dp = pts(keys.map(k=>(S.scores[k]||0)/max));
  s += `<polygon points="${dp.map(x=>x.join(',')).join(' ')}" fill="rgba(255,215,0,0.25)" stroke="#c9a25a" stroke-width="1.5"/>`;
  for(let i=0;i<n;i++){
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    const lx = cx + Math.cos(ang)*(R+22), ly = cy + Math.sin(ang)*(R+22);
    const v = S.scores[keys[i]]||0;
    s += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#8a6a35">${keys[i]}</text>`;
    s += `<text x="${cx+Math.cos(ang)*(R+38)}" y="${cy+Math.sin(ang)*(R+38)}" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#7d6a4d">${v}</text>`;
  }
  s += `</svg>`;
  return s;
}

/* ============ 结果页 ============ */
function renderResult(){
  const n = S.done.length;
  const mt = mainType();
  const p = PERSONS[mt];
  const title = titleNow();
  const barCol = {傲:'#c9a25a',郁:'#9a7a3a',雅:'#c9a25a',逸:'#c9a25a',和:'#a37c34',归:'#c9a25a'};
  let h = `<a class="btn" onclick="render()">← <span data-l="back2">镜门</span></a>`;
  h += `<div class="card result">`;
  h += `<div class="g">观我 · 名士像</div>`;
  h += `<div class="persona">
    <div class="avatar">${mt}</div>
    <div class="pt2">
      <div class="n">${p.n} · ${p.t}</div>
      <div class="d">${p.d}<br>已照之镜 ${n}/36 · 名士称号：${title.n}</div>
    </div>
  </div>`;
  h += `<div class="radar">${radarSVG()}</div>`;
  h += `<div class="bars">`;
  for(const k of KEYS){
    const v = S.scores[k]||0;
    const pct = Math.min(100, Math.round(v/Math.max(1,n/3)*100));
    h += `<div class="bar-row"><span class="bn">${k}</span><div class="bt"><div class="bf" style="width:${pct}%"></div></div><span class="bv">${v}</span></div>`;
  }
  h += `</div>`;
  const shareTxt = `澄怀照见：我是${p.n}型（${p.d}）。已照${n}/36 面镜，称号「${title.n}」。`;
  h += `<button class="btn primary" onclick="makeCard()"><span data-l="card">绘我名士名片</span></button> `;
  h += `<button class="btn" onclick="go('home')"><span data-l="more">继续照镜</span></button></div>`;
  V.innerHTML = h;
  bindL();
  window.scrollTo({top:0});
}

/* ============ 名片（canvas） ============ */
function makeCard(){
  const mt = mainType(), p = PERSONS[mt];
  const title = titleNow();
  const W = 900, H = 1350;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  // 米黄底
  ctx.fillStyle = '#f2e6cd'; ctx.fillRect(0,0,W,H);
  // 边框
  ctx.strokeStyle = '#b8914f'; ctx.lineWidth = 6;
  ctx.strokeRect(24,24,W-48,H-48);
  ctx.strokeStyle = '#8a6a35'; ctx.lineWidth = 1;
  ctx.strokeRect(36,36,W-72,H-72);
  // 竖排主标
  ctx.fillStyle = '#8a6a35';
  ctx.font = 'bold 64px KaiTi,STKaiti,SimSun';
  ctx.textAlign = 'center';
  ctx.fillText('澄', W-110, 170);
  ctx.fillText('怀', W-110, 250);
  // 名士像
  ctx.fillStyle = '#3e2f1d';
  ctx.font = 'bold 80px KaiTi,STKaiti,SimSun';
  ctx.fillText(p.n, W/2, 300);
  ctx.font = '30px KaiTi';
  ctx.fillStyle = '#7a5c1e';
  ctx.fillText(p.t + ' · ' + p.d, W/2, 360);
  // 名言
  const w = DAYWORDS[new Date().getDate() % DAYWORDS.length];
  ctx.fillStyle = '#5a4a2a';
  ctx.font = '34px KaiTi';
  ctx.fillText('「' + w[0] + '」', W/2, 460);
  ctx.font = '22px SimSun';
  ctx.fillStyle = '#7d6a4d';
  ctx.fillText('—— ' + w[1], W/2, 510);
  // 数据
  ctx.fillStyle = '#3e2f1d';
  ctx.font = '26px SimSun';
  const order = KEYS.slice().sort((a,b)=>(S.scores[b]||0)-(S.scores[a]||0));
  let yy = 610;
  for(const k of order){
    ctx.fillText(k + ' 型 ' + PERSONS[k].n + '　' + (S.scores[k]||0) + ' 镜', W/2, yy);
    yy += 48;
  }
  ctx.fillStyle = '#7a5c1e';
  ctx.font = '30px KaiTi';
  ctx.fillText('称号 · ' + title.n + '　已照 ' + S.done.length + '/36 镜', W/2, yy+30);
  // 署名
  ctx.fillStyle = '#8a6a35';
  ctx.font = '26px SimSun';
  ctx.fillText('永远的兰兰 · Lanlan Eternal', W/2, H-140);
  ctx.font = '20px SimSun';
  ctx.fillStyle = '#7d6a4d';
  ctx.fillText('chen · 世说镜鉴录', W/2, H-96);
  ctx.fillText('podcatcher962.github.io/ChenMirror', W/2, H-60);
  // 印章
  ctx.save();
  ctx.translate(W/2, 470); ctx.rotate(-0.07);
  ctx.strokeStyle = '#b03a2e'; ctx.lineWidth = 3;
  ctx.strokeRect(-34,-34,68,68);
  ctx.fillStyle = '#b03a2e';
  ctx.font = '28px KaiTi';
  ctx.fillText(p.m, 0, 12);
  ctx.restore();
  // 显示
  const dataUrl = cv.toDataURL('image/png');
  V.innerHTML = `<a class="btn" onclick="renderResult()">← <span data-l="back3">名士像</span></a>
    <div class="card" style="text-align:center">
      <img src="${dataUrl}" style="max-width:100%;border:1px solid var(--mutedBdr)" alt="名士名片">
      <div style="margin-top:14px">
        <a class="btn primary" download="chen_mirror_card.png" href="${dataUrl}"><span data-l="save">保存名片</span></a>
        <button class="btn" onclick="copyTxt()"><span data-l="copy">复制结语</span></button>
      </div>
    </div>`;
  bindL();
  window.scrollTo({top:0});
}
function copyTxt(){
  const mt = mainType(), p = PERSONS[mt];
  const txt = `澄怀 · 世说镜鉴录｜我照见自己为「${p.n}」型（${p.d}），称号「${titleNow().n}」，已照 ${S.done.length}/36 面镜。你也来照一照：podcatcher962.github.io/ChenMirror`;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('已复制'));
  } else {
    const ta = document.createElement('textarea'); ta.value = txt;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    toast('已复制');
  }
}
let _toastT;
function toast(msg){
  let el = document.getElementById('toastEl');
  if(!el){ el = document.createElement('div'); el.id = 'toastEl';
    el.style.cssText = 'position:fixed;top:22px;left:50%;transform:translateX(-50%);background:#b8914f;color:#3e2f1d;padding:10px 22px;font-size:13px;z-index:999;border-radius:4px';
    document.body.appendChild(el); }
  el.textContent = msg; el.style.opacity = '1';
  clearTimeout(_toastT); _toastT = setTimeout(()=>{ el.style.opacity = '0'; }, 1800);
}
